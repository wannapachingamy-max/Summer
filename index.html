<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMMER 🧸⋆⁺₊⋆</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Mitr:wght@300;400;500;600;700&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        prompt: ['Prompt', 'sans-serif'],
                        mitr: ['Mitr', 'sans-serif'],
                        serifNum: ['Cormorant Garamond', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        * { font-family: 'Prompt', sans-serif !important; }
        .font-mitr, .font-mitr * { font-family: 'Mitr', sans-serif !important; }
        .font-serif-num { font-family: 'Cormorant Garamond', serif !important; }

        body {
            background-color: #f3f4f0;
            background-image: 
                radial-gradient(at 10% 10%, rgba(228, 235, 226, 0.9) 0px, transparent 55%),
                radial-gradient(at 90% 90%, rgba(243, 235, 228, 0.9) 0px, transparent 60%);
            background-attachment: fixed;
            color: #4a4843;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .text-header-title { color: #4e584f; letter-spacing: 0.05em; }

        .leaf-container {
            position: fixed; top: -10%; left: 0; width: 100%; height: 120vh; pointer-events: none; z-index: 0; overflow: hidden;
        }
        .leaf {
            position: absolute; top: -20px; font-size: 1.2rem; opacity: 0.6; animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.5; }
            100% { transform: translateY(110vh) rotate(360deg) translateX(40px); opacity: 0; }
        }
        .leaf:nth-child(1) { left: 8%; animation-duration: 10s; animation-delay: 0s; }
        .leaf:nth-child(2) { left: 25%; animation-duration: 13s; animation-delay: 2s; }
        .leaf:nth-child(3) { left: 45%; animation-duration: 9s; animation-delay: 4s; }
        .leaf:nth-child(4) { left: 70%; animation-duration: 11s; animation-delay: 1s; }
        .leaf:nth-child(5) { left: 88%; animation-duration: 12s; animation-delay: 3s; }

        .capsule-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(215, 222, 212, 0.9);
            box-shadow: 0 8px 25px -4px rgba(140, 145, 135, 0.12);
            border-radius: 9999px !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .capsule-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 12px 30px -4px rgba(140, 145, 135, 0.2);
        }

        .review-capsule-item {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(215, 222, 212, 0.9);
            box-shadow: 0 6px 20px rgba(140, 145, 135, 0.1);
            border-radius: 9999px !important;
            width: 100%;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(215, 222, 212, 0.9);
            border-radius: 1.25rem;
            box-shadow: 0 4px 15px rgba(140, 145, 135, 0.06);
        }

        .bottom-nav-capsule {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(215, 222, 212, 0.9);
            box-shadow: 0 10px 30px rgba(140, 145, 135, 0.2);
            border-radius: 9999px !important;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(2deg); }
        }
        .animate-float { animation: floatSlow 4s ease-in-out infinite; }

        .vertical-marquee-container {
            height: 140px; overflow: hidden; position: relative; width: 100%;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }
        .vertical-marquee-track {
            position: absolute; width: 100%; display: flex; flex-direction: column; gap: 12px;
            animation: scrollVertical 16s linear infinite;
        }
        .vertical-marquee-container:hover .vertical-marquee-track { animation-play-state: paused; }
        @keyframes scrollVertical {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }
    </style>
</head>
<body class="min-h-screen pb-32 selection:bg-[#d4ded0] relative">

    <div class="leaf-container">
        <span class="leaf">🧸</span><span class="leaf">✨</span><span class="leaf">🤍</span><span class="leaf">🌿</span><span class="leaf">🧸</span>
    </div>

    <div class="max-w-lg mx-auto min-h-screen flex flex-col justify-between px-4 py-6 relative z-10">
        <div>
            <header class="flex items-center justify-between mb-6 pt-3 pl-1 relative">
                <div class="flex items-center gap-4">
                    <div class="relative group flex-shrink-0">
                        <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-[#9bb3a0] via-[#d0dcd4] to-[#f0eae1] p-1 shadow-md flex items-center justify-center animate-float">
                            <div class="w-full h-full rounded-full bg-[#ffffff] flex items-center justify-center overflow-hidden border-2 border-[#e2e8e3]">
                                <span class="text-3xl">🧸</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-left">
                        <h1 class="text-3xl font-extrabold tracking-wide text-header-title flex items-center gap-2 font-mitr leading-none">
                            SUMMER <span class="text-sm text-[#8c7b6d] font-normal">. ♡ ˚</span>
                        </h1>
                        <p class="text-xs text-[#787a70] tracking-tight mt-1.5 font-medium">˚｡⋆ welcome to store 🦝 ⋆｡˚</p>
                    </div>
                </div>

                <div class="px-3.5 py-1.5 rounded-full bg-white/90 border-2 border-[#d0dcd4] backdrop-blur-md shadow-sm flex items-center gap-2">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-600"></span>
                    </span>
                    <span class="text-[11px] font-bold text-[#4e584f] font-mitr">ร้านเปิดบริการ</span>
                </div>
            </header>

            <div class="px-3 mb-6 flex items-start gap-2.5 text-xs text-[#686b62] leading-relaxed">
                <span class="text-sm flex-shrink-0 mt-0.5">🌿</span>
                <p class="font-normal">
                    รับซื้อขายไอดีราคาร้อน ขายไอดีเกมช่องทางการติดต่อกดช่องคอนแทคได้เลย ฝากรีวิวด้วยน้าคะเป็นกำลังใจ 🪞🪄
                </p>
            </div>

            <main class="space-y-4">
                <div class="w-full rounded-3xl overflow-hidden shadow-md border-2 border-[#d0dcd4] bg-white/60 backdrop-blur-md p-1.5 mb-2">
                    <img src="2D5182E6-2D73-460D-AA9B-4E6A3B7158C4.gif" alt="GIF ตกแต่งพิเศษ" class="w-full h-auto max-h-48 object-cover rounded-2xl block">
                </div>

                <button onclick="openModal('rov')" class="w-full capsule-card px-5 py-4 flex items-center justify-between group">
                    <div class="flex items-center space-x-4">
                        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-[#dfdad2] to-[#c6d4cb] flex items-center justify-center text-[#525a51] flex-shrink-0 shadow-sm">
                            <i data-lucide="gamepad-2" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-bold text-[#4e584f] font-mitr">౨ৎ งานป้าย Rov</span>
                            <span class="text-[11px] text-[#787a70]">ดูเรทงานและตัวอย่างป้ายทั้งหมด</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-[#787a70]"></i>
                </button>

                <!-- ปุ่มเช็คคิว เปลี่ยนเป็นลิงก์เปิดเว็บเช็คคิวของคุณทันที -->
                <a href="https://wannapachingamy-max.github.io/Qaummer/" target="_blank" class="w-full capsule-card px-5 py-4 flex items-center justify-between group">
                    <div class="flex items-center space-x-4">
                        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-[#ecdcd4] to-[#d4dcd0] flex items-center justify-center text-[#525a51] flex-shrink-0 shadow-sm">
                            <i data-lucide="calendar" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-bold text-[#4e584f] font-mitr">⟢ เช็คคิว</span>
                            <span class="text-[11px] text-[#787a70]">ตารางคิวสถานะปัจจุบัน</span>
                        </div>
                    </div>
                    <i data-lucide="external-link" class="w-5 h-5 text-[#787a70]"></i>
                </a>

                <button onclick="openModal('stock')" class="w-full capsule-card px-5 py-4 flex items-center justify-between group">
                    <div class="flex items-center space-x-4">
                        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-[#e4eade] to-[#d6c7be] flex items-center justify-center text-[#625950] flex-shrink-0 shadow-sm">
                            <i data-lucide="sparkles" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-bold text-[#4e584f] font-mitr">🪽 ไอดีที่ยังเหลืออยู่</span>
                            <span class="text-[11px] text-[#787a70]">รายการไอดีพร้อมส่งมอบ</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-[#787a70]"></i>
                </button>

                <div class="grid grid-cols-2 gap-3 my-2">
                    <div class="w-full aspect-square rounded-3xl overflow-hidden shadow-md border-2 border-[#d0dcd4] bg-white/60 backdrop-blur-md p-1">
                        <img src="F1090F6F-DB2D-4F4A-A801-E791E5E752EF.gif" alt="GIF ตกแต่ง 1" class="w-full h-full object-cover rounded-2xl block">
                    </div>
                    <div class="w-full aspect-square rounded-3xl overflow-hidden shadow-md border-2 border-[#d0dcd4] bg-white/60 backdrop-blur-md p-1">
                        <img src="EE699540-D77C-4585-B36E-402392D54160.gif" alt="GIF ตกแต่ง 2" class="w-full h-full object-cover rounded-2xl block">
                    </div>
                </div>

                <!-- ส่วนแสดงผลรีวิว -->
                <section id="review-section" class="pt-4 pb-2">
                    <div class="flex items-center justify-between mb-3 px-1">
                        <div class="flex items-center gap-2">
                            <span class="w-7 h-7 rounded-full bg-[#9fb3a0] text-white flex items-center justify-center shadow-sm">
                                <i data-lucide="message-circle-heart" class="w-3.5 h-3.5"></i>
                            </span>
                            <h2 class="text-sm font-bold text-[#4e584f] font-mitr tracking-wide">รีวิวจากคุณลูกค้า</h2>
                        </div>
                        <a href="review.html" class="text-[11px] text-[#9fb3a0] font-bold hover:underline font-mitr flex items-center gap-1">
                            เขียนรีวิว <i data-lucide="external-link" class="w-3 h-3"></i>
                        </a>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div class="stat-card py-4 px-3 flex flex-col items-center justify-center text-center">
                            <span id="stat-total" class="text-2xl font-serif-num text-[#4e584f] mb-0.5 font-bold">4</span>
                            <span class="text-[11px] text-[#787a70] font-prompt font-semibold">รีวิวทั้งหมด</span>
                        </div>
                        <div class="stat-card py-4 px-3 flex flex-col items-center justify-center text-center">
                            <span id="stat-avg" class="text-2xl font-serif-num text-[#4e584f] mb-0.5 font-bold">5.0</span>
                            <span class="text-[11px] text-[#787a70] font-prompt font-semibold">คะแนนเฉลี่ย</span>
                        </div>
                        <div class="stat-card py-4 px-3 flex flex-col items-center justify-center text-center">
                            <span id="stat-fives" class="text-2xl font-serif-num text-[#4e584f] mb-0.5 font-bold">4</span>
                            <span class="text-[11px] text-[#787a70] font-prompt font-semibold">รีวิว 5 ดาว</span>
                        </div>
                        <div class="stat-card py-4 px-3 flex flex-col items-center justify-center text-center">
                            <span id="stat-ones" class="text-2xl font-serif-num text-[#4e584f] mb-0.5 font-bold">0</span>
                            <span class="text-[11px] text-[#787a70] font-prompt font-semibold">รีวิว 1 ดาว</span>
                        </div>
                    </div>

                    <div class="vertical-marquee-container">
                        <div class="vertical-marquee-track" id="vertical-track-content"></div>
                    </div>
                </section>
            </main>
        </div>

        <footer class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2.5rem)] max-w-sm z-40">
            <nav class="bottom-nav-capsule px-6 py-2.5 flex items-end justify-between relative">
                <a href="review.html" class="flex flex-col items-center group pb-0.5">
                    <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-[#4e584f] group-hover:bg-[#d0dcd4] shadow-sm border border-[#d0dcd4] transition-all">
                        <i data-lucide="message-square" class="w-4 h-4"></i>
                    </div>
                </a>

                <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center -mt-5 group">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-[#9bb3a0] via-[#d0dcd4] to-[#f0eae1] text-white flex items-center justify-center shadow-md border-2 border-white group-hover:scale-105 transition-all">
                        <i data-lucide="home" class="w-5 h-5 text-[#4e584f]"></i>
                    </div>
                    <span class="text-[10px] font-extrabold text-[#4e584f] mt-1 font-mitr tracking-wide">Home</span>
                </button>

                <a href="https://wannapachingamy-max.github.io/Contactsummer/" target="_blank" class="flex flex-col items-center group pb-0.5">
                    <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-[#4e584f] group-hover:bg-[#d0dcd4] shadow-sm border border-[#d0dcd4] transition-all">
                        <i data-lucide="contact" class="w-4 h-4"></i>
                    </div>
                </a>
            </nav>
        </footer>
    </div>

    <!-- Modal ข้อมูลร้าน (สำหรับปุ่มอื่นๆ เช่น งานป้าย หรือ ไอดีที่เหลือ) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#f5f4f0] border-2 border-[#d0dcd4] rounded-3xl max-w-sm w-full p-5 relative shadow-xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-[#d0dcd4] flex items-center justify-center text-[#4e584f]">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <div id="modal-content" class="text-xs space-y-3"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let sampleReviews = JSON.parse(localStorage.getItem('summer_store_reviews')) || [
            { name: "คุณน้องแป้ง RoV", rating: 5, text: "ซื้อไอดีกับร้าน SUMMER โอนปุ๊บรหัสเข้าปั๊บ ไวมากแม่ แนะนำเลยค่า ✨✨", time: "5 นาทีที่แล้ว", bg: "bg-[#9fb3a0]" },
            { name: "น้องกอล์ฟ สายลุย", rating: 5, text: "ขายไอดีราคาร้อนกับร้านนี้ ให้ราคาดีมาก แม่ค้าพูดจาดี น่ารักครับ ❤️", time: "18 นาทีที่แล้ว", bg: "bg-[#87998a]" },
            { name: "ลูกค้าประจำ #88", rating: 5, text: "เครดิตแน่น ซื้อขายสบายใจได้แน่นอนครับ ป้าย RoV ของจริง!", time: "1 ชั่วโมงที่แล้ว", bg: "bg-[#78887b]" },
            { name: "น้องพลอย_RoV", rating: 5, text: "สั่งทำป้าย RoV สวยสะดุดตามากกก มีรอบหน้าอีกแน่นอนค่ะ ✨", time: "2 ชั่วโมงที่แล้ว", bg: "bg-[#8c7b6d]" }
        ];

        function updateStats() {
            const total = sampleReviews.length;
            const sumRating = sampleReviews.reduce((acc, curr) => acc + curr.rating, 0);
            const avg = total > 0 ? (sumRating / total).toFixed(1) : "5.0";
            const fives = sampleReviews.filter(r => r.rating === 5).length;
            const ones = sampleReviews.filter(r => r.rating === 1).length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-avg').innerText = avg;
            document.getElementById('stat-fives').innerText = fives;
            document.getElementById('stat-ones').innerText = ones;
        }

        function renderVerticalMarquee() {
            const track = document.getElementById('vertical-track-content');
            if(!track) return;
            track.innerHTML = '';
            const listToRender = [...sampleReviews, ...sampleReviews];

            listToRender.forEach((rev) => {
                const initial = rev.name.charAt(0);
                const starsHtml = '★'.repeat(rev.rating);
                const card = document.createElement('div');
                card.className = "review-capsule-item px-5 py-3 flex-shrink-0";
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <div class="flex items-center gap-2.5">
                            <div class="w-6 h-6 rounded-full ${rev.bg} text-white font-bold flex items-center justify-center text-[10px] shadow-sm flex-shrink-0">${initial}</div>
                            <span class="font-bold text-xs text-[#4e584f] font-mitr">${rev.name}</span>
                        </div>
                        <span class="text-[9px] text-[#7b8780] font-medium">${rev.time}</span>
                    </div>
                    <div class="flex items-center justify-between pl-8 gap-2">
                        <p class="text-[#4a4843] text-xs leading-snug font-normal line-clamp-1">${rev.text}</p>
                        <span class="text-amber-500 text-[10px] tracking-wider flex-shrink-0">${starsHtml}</span>
                    </div>
                `;
                track.appendChild(card);
            });
            updateStats();
        }

        renderVerticalMarquee();

        function openModal(type) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            let html = '';
            if (type === 'rov') {
                html = `<h3 class="font-bold text-sm text-[#4e584f] mb-2 font-mitr">౨ৎ งานป้าย RoV</h3><p class="text-[#686b62] mb-2">รับทำป้ายโปรไฟล์ RoV, ป้ายเครดิต สไตล์สวยหวานน่ารัก</p>`;
            } else if (type === 'stock') {
                html = `<h3 class="font-bold text-sm text-[#4e584f] mb-2 font-mitr">🪽 ไอดีที่ยังเหลืออยู่</h3><div class="p-3 bg-white rounded-2xl border border-[#d0dcd4]"><div class="font-bold text-[#4e584f] font-mitr text-xs">ID RoV - สกินสเปเชียลครบ</div><div class="text-xs font-bold text-[#686b62] mt-1">ราคา 1,290 ฿</div></div>`;
            }
            content.innerHTML = html;
            overlay.classList.remove('hidden');
        }
        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
    </script>
</body>
</html>
