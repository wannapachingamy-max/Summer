    <!-- Google Fonts: Prompt & Mitr -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600;700&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        prompt: ['Prompt', 'sans-serif'],
                        mitr: ['Mitr', 'sans-serif']
                    }
                }
            }
        }

    <style>
        /* บังคับใช้ Prompt เป็นฟอนต์หลักทั้งเว็บ */
        * {
            font-family: 'Prompt', sans-serif !important;
        }
        
        /* บังคับใช้ Mitr เฉพาะส่วนหัวข้อ/ชื่อร้าน */
        .font-mitr, .font-mitr * {
            font-family: 'Mitr', sans-serif !important;
        }

        body {
            background-color: #f8f2ec;
            background-image: 
                /* Soft warm gradient overlay for high readability */
                linear-gradient(180deg, rgba(251, 247, 244, 0.82) 0%, rgba(245, 236, 229, 0.88) 50%, rgba(239, 228, 219, 0.92) 100%),
                /* Subtle artistic nature, leaves & water stream motif background */
                url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1200&auto=format&fit=crop');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: #6b584c;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient floating leaves vector pattern overlay */
        .leaf-bg-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.12;
            background-image: radial-gradient(#8c9e82 1px, transparent 1px), radial-gradient(#d4b3a1 1px, transparent 1px);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
        }
        
        /* บล็อกทรงแคปซูล (Pill / Capsule Shape) */
        .capsule-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(230, 215, 205, 0.95);
            box-shadow: 0 4px 18px -2px rgba(168, 142, 128, 0.12);
            border-radius: 9999px !important;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .capsule-card:hover {
            transform: translateY(-2px) scale(1.01);
            background: rgba(255, 255, 255, 0.96);
            border-color: #dfcdbf;
            box-shadow: 0 8px 24px -4px rgba(168, 142, 128, 0.2);
        }

        .capsule-box {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(230, 215, 205, 0.95);
            box-shadow: 0 8px 24px -6px rgba(168, 142, 128, 0.12);
            border-radius: 2rem;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #f09587 0%, #e67d71 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(230, 125, 113, 0.3);
            transition: all 0.25s ease;
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #e88677 0%, #d96e62 100%);
            transform: translateY(-1px) scale(1.01);
            box-shadow: 0 6px 16px rgba(230, 125, 113, 0.4);
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(2deg); }
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
            50% { opacity: 0.85; transform: scale(1.05); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(12px); }
                <!-- รีวิว -->

                            </div>

                            </div>

                            <!-- คะแนนเฉลี่ย -->

                            <!-- รีวิว 5 ดาว -->

                                <span id="stat-5star-count" class="text-3xl font-serif text-[#6c5b52] font-normal leading-none mb-1.5">4</span>

                            </div>

                            <!-- รีวิว 1 ดาว -->

                                <span class="text-xs text-[#8c786c] font-mitr">รีวิว 1 ดาว</span>
                            </div>
                        </div>

                        <!-- รายการรีวิว -->
                        <div id="review-list" class="space-y-3 max-h-96 overflow-y-auto custom-scrollbar pr-1">
                        </div>
                    </div>
                </section>
            </main>
        </div>
                        </div>
                    </div>
                    
                    <!-- ชื่อร้าน SUMMER ต่อข้างๆ -->
                    <div class="text-left">
                        <h1 class="text-2xl font-bold tracking-wide text-[#5c4a3e] flex items-center gap-1.5 font-mitr leading-none">
                            SUMMER
                            <span class="text-xs text-[#a38f83] font-normal animate-pulse">. ♡ ˚</span>
                        </h1>
                        <p class="text-[11px] text-[#9c8678] tracking-tight mt-1">˚｡⋆ welcome to store 🦝 ⋆｡˚</p>
                    </div>
                </div>

                <!-- ไฟสถานะร้านค้า (Status Light Indicator) -->
                <div class="capsule-card px-3 py-1.5 flex items-center gap-2 border border-[#d8e6d2] bg-white/90 shadow-sm flex-shrink-0">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500 animate-status-ping"></span>
                    </span>
                    <span class="text-[10px] font-semibold text-[#4a5442] font-mitr tracking-wide">ร้านเปิดบริการ</span>
                </div>
            </header>

            <!-- คำโปรยอธิบาย บล็อกทรงแคปซูล -->
            <div class="capsule-card px-6 py-3.5 mb-5 text-xs text-[#786455] leading-relaxed relative overflow-hidden flex items-center gap-3">
                <span class="text-base flex-shrink-0 animate-float-icon">🎀</span>
                <p class="text-xs leading-snug">
                    รับซื้อขายไอดีราคาร้อน ขายไอดีเกมช่องทางการติดต่อกด ช่องคอนแทคได้เลย ฝากรีวิวด้วยน้าคะเป็นกำลังใจ 🪞🪄
                </p>
            </div>

            <!-- บล็อกเมนูรายการต่างๆ (ทรงแคปซูล + มีแอนิเมชันขยับ) -->
            <main class="space-y-3.5">
                
                <!-- 1. งานป้าย Rov -->
                <button onclick="openModal('rov')" class="w-full capsule-card px-5 py-3.5 flex items-center justify-between group border border-[#ebdcd0]">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-10 h-10 rounded-full bg-[#f0e4db] flex items-center justify-center text-[#735e50] group-hover:rotate-6 group-hover:scale-110 transition-all duration-300 flex-shrink-0">
                            <i data-lucide="gamepad-2" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-semibold text-[#5c4a3e] font-mitr group-hover:text-[#e67d71] transition-colors">౨ৎ งานป้าย Rov</span>
                            <span class="text-[11px] text-[#9c8678]">ดูเรทงานและตัวอย่างป้ายทั้งหมด</span>

                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-[#b39e91] group-hover:translate-x-1.5 transition-transform"></i>
                </button>

                <!-- 2. เช็คคิว -->
                <button onclick="openModal('queue')" class="w-full capsule-card px-5 py-3.5 flex items-center justify-between group border border-[#ebdcd0]">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-10 h-10 rounded-full bg-[#e3eae0] flex items-center justify-center text-[#586851] group-hover:-rotate-6 group-hover:scale-110 transition-all duration-300 flex-shrink-0">

                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-semibold text-[#5c4a3e] font-mitr group-hover:text-[#586851] transition-colors">⟢ เช็คคิว</span>
                            <span class="text-[11px] text-[#9c8678]">ตารางคิวสถานะปัจจุบัน</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-[#b39e91] group-hover:translate-x-1.5 transition-transform"></i>
                </button>

                <!-- 3. ไอดีที่ยังเหลืออยู่ -->
                <button onclick="openModal('stock')" class="w-full capsule-card px-5 py-3.5 flex items-center justify-between group border border-[#ebdcd0]">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-10 h-10 rounded-full bg-[#f5e6e8] flex items-center justify-center text-[#805e63] group-hover:rotate-6 group-hover:scale-110 transition-all duration-300 flex-shrink-0">
                            <i data-lucide="sparkles" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">

                            <span class="text-[11px] text-[#9c8678]">รายการไอดีพร้อมส่งมอบ</span>

                    <i data-lucide="chevron-right" class="w-5 h-5 text-[#b39e91] group-hover:translate-x-1.5 transition-transform"></i>

                <!-- ส่วนรีวิว (Review Section) -->
        <section id="review-section" class="pt-2">
            <div class="capsule-box p-5 border border-[#ebdcd0] shadow-sm">
                
                <!-- Review Header -->
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <span class="w-7 h-7 rounded-full bg-[#fceee9] flex items-center justify-center text-[#e67d71]">
                            <i data-lucide="message-circle" class="w-4 h-4"></i>
                        </span>
                        <h2 class="text-lg font-bold text-[#5c4a3e] font-mitr">Review</h2>
                    </div>
                    <span class="px-3 py-1 rounded-full text-[10px] font-semibold bg-[#e3eae0] text-[#586851] flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-[#6a8060] animate-pulse"></span>
                        Live Feedback
                    </span>
                </div>

                <!-- ฟอร์มฝากรีวิว -->
                <div class="bg-white/90 rounded-3xl p-4 border border-[#eee0d6] mb-5 shadow-sm">
                    <div class="flex items-center gap-1.5 text-xs font-semibold text-[#6e5a4d] mb-3">
                        <i data-lucide="edit-3" class="w-3.5 h-3.5 text-[#e67d71]"></i>
                        <span>ฝากรีวิวให้ร้าน SUMMER</span>
                    </div>

                    <input id="user-name-input" type="text" placeholder="ชื่อ หรือ ไอดีลูกค้า..." class="w-full bg-[#fdfbf9] text-xs px-4 py-2.5 rounded-full border border-[#e8dad0] focus:outline-none focus:border-[#e67d71] text-[#6b584c] mb-2.5 transition-colors">

                    <div class="flex items-center justify-between mb-2.5 px-2">
                        <span class="text-xs text-[#8c786c]">ให้คะแนนร้าน:</span>
                        <div id="star-rating" class="flex gap-1 text-amber-400 text-base cursor-pointer">
                            <span onclick="setRating(1)">★</span>
                            <span onclick="setRating(2)">★</span>
                            <span onclick="setRating(3)">★</span>
                            <span onclick="setRating(4)">★</span>
                            <span onclick="setRating(5)">★</span>
                        </div>
                    </div>

                    <textarea id="user-text-input" rows="2" placeholder="เขียนความประทับใจ การบริการ..." class="w-full bg-[#fdfbf9] text-xs px-4 py-2.5 rounded-2xl border border-[#e8dad0] focus:outline-none focus:border-[#e67d71] text-[#6b584c] mb-3 resize-none transition-colors"></textarea>

                    <button onclick="addReview()" class="w-full btn-gradient py-2.5 rounded-full font-medium flex items-center justify-center gap-2 transition-all font-mitr text-xs active:scale-95">
                        <i data-lucide="send" class="w-3.5 h-3.5"></i>

                    </button>

                <!-- รายการรีวิวทรงแคปซูล -->

        <!-- ปุ่มซ้าย: Review / Message Bubble -->

<div id="modal-overlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            </button>

    <script>
        lucide.createIcons();

        let currentRating = 5;

        const sampleReviews = [
            { name: "คุณน้องแป้ง RoV", rating: 5, text: "ซื้อไอดีกับร้าน SUMMER โอนปุ๊บรหัสเข้าปั๊บ ไวมากแม่ แนะนำเลยค่า ✨✨", time: "5 นาทีที่แล้ว", bg: "bg-[#f59e0b]" },
            { name: "น้องกอล์ฟ สายลุย", rating: 5, text: "ขายไอดีราคาร้อนกับร้านนี้ ให้ราคาดีมาก แม่ค้าพูดจาดี น่ารักครับ ❤️", time: "18 นาทีที่แล้ว", bg: "bg-[#e67d71]" },
            { name: "ลูกค้าประจำ #88", rating: 5, text: "เครดิตแน่น ซื้อขายสบายใจได้แน่นอนครับ ป้าย RoV ของจริง!", time: "1 ชั่วโมงที่แล้ว", bg: "bg-[#829e75]" },
            { name: "คุณมินต์ VIP", rating: 5, text: "บริการประทับใจ ตอบไวมากจ้า ยอดเยี่ยมมมม ✨", time: "2 ชั่วโมงที่แล้ว", bg: "bg-[#9b72b0]" }
        ];

        function updateReviewStats() {
            const total = sampleReviews.length;
            const fiveStars = sampleReviews.filter(r => r.rating === 5).length;
            const oneStars = sampleReviews.filter(r => r.rating === 1).length;
            
            const avg = total > 0 
                ? (sampleReviews.reduce((sum, r) => sum + r.rating, 0) / total).toFixed(1)
                : "0.0";

            document.getElementById('stat-total-count').textContent = total;
            document.getElementById('stat-avg-rating').textContent = avg;
            document.getElementById('stat-5star-count').textContent = fiveStars;
            document.getElementById('stat-1star-count').textContent = oneStars;
        }

        function renderReviews() {
            const list = document.getElementById('review-list');
            list.innerHTML = '';
            sampleReviews.forEach(rev => {
                const initial = rev.name.charAt(0);
                const starsHtml = '★'.repeat(rev.rating);
                
                const item = document.createElement('div');
                item.className = "px-4 py-3 rounded-2xl bg-white/95 border border-[#f0e3d9] transition-all shadow-sm";
                item.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <div class="flex items-center gap-2">
                            <div class="w-7 h-7 rounded-full ${rev.bg || 'bg-[#e67d71]'} text-white font-bold flex items-center justify-center text-[10px] shadow-sm">
                                ${initial}
                            </div>
                            <span class="font-bold text-xs text-[#4a3c32] font-mitr">${rev.name}</span>
                        </div>
                        <span class="text-[10px] text-[#a38f83]">${rev.time}</span>
                    </div>
                    <div class="text-amber-400 text-[10px] mb-1 tracking-wider">${starsHtml}</div>
                    <p class="text-[#6b584c] text-xs leading-relaxed font-normal">${rev.text}</p>
                `;
                list.appendChild(item);
            });

            updateReviewStats();
        }

        renderReviews();

        function openModal(type) {
            const overlay = document.getElementById('modal-overlay');
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            
            let html = '';
            if (type === 'rov') {
                html = `
                    <h3 class="font-semibold text-sm text-[#5c4a3e] mb-2 font-mitr flex items-center gap-1">౨ৎ งานป้าย RoV</h3>
                    <p class="text-[#786455] mb-2">รับทำป้ายโปรไฟล์ RoV, ป้ายเครดิต, ป้ายตกแต่งสตรีมมิ่ง สไตล์สวยหวานน่ารัก</p>
                    <div class="bg-white/80 p-3 rounded-2xl border border-[#ede0d4] space-y-1">
                        <div class="flex justify-between"><span>ป้ายเดี่ยว:</span> <span class="font-medium text-[#4a5442]">50 - 150 ฿</span></div>
                        <div class="flex justify-between"><span>ป้ายคู่ / ทีม:</span> <span class="font-medium text-[#4a5442]">180 - 350 ฿</span></div>
                    </div>
                `;
            } else if (type === 'queue') {
                html = `
                    <h3 class="font-semibold text-sm text-[#5c4a3e] mb-2 font-mitr flex items-center gap-1">⟢ สถานะเช็คคิว</h3>
                    <div class="space-y-2">
                        <div class="p-2.5 bg-white/80 rounded-full flex justify-between items-center border border-[#e3eae0] px-4">
                            <span>คิวที่ 1: คุณ Mild</span>
                            <span class="text-[10px] bg-[#cbd5c0] text-[#4a5442] px-2.5 py-0.5 rounded-full font-medium">กำลังทำ</span>
                        </div>
                        <div class="p-2.5 bg-white/80 rounded-full flex justify-between items-center border border-[#eee1d8] px-4">
                            <span>คิวที่ 2: คุณ Oat</span>
                            <span class="text-[10px] bg-[#e8ded5] text-[#7a6759] px-2.5 py-0.5 rounded-full font-medium">รอคิว</span>
                        </div>
                    </div>
                `;
            } else if (type === 'stock') {
                html = `
                    <h3 class="font-semibold text-sm text-[#5c4a3e] mb-2 font-mitr flex items-center gap-1">🪽 ไอดีที่ยังเหลืออยู่</h3>
                    <div class="space-y-2">
                        <div class="p-3 bg-white/80 rounded-2xl border border-[#ebdcd0]">
                            <div class="font-medium text-[#5c4a3e] font-mitr text-xs">ID RoV - สกินสเปเชียลครบ</div>
                            <div class="text-[10px] text-[#9c8678]">รูน 90 | ฮีโร่ครบ | สกิน 180+</div>
                            <div class="text-xs font-semibold text-[#6e8563] mt-1">ราคา 1,290 ฿ (พร้อมโอนลดได้)</div>
                        </div>
                    </div>
                `;
            } else if (type === 'contact') {
                html = `
                    <h3 class="font-semibold text-sm text-[#5c4a3e] mb-2 font-mitr flex items-center gap-1">📮 ช่องทางการติดต่อ</h3>
                    <p class="text-[#786455] mb-3">กดเลือกช่องทางเพื่อสอบถามหรือสั่งซื้อได้เลยค่ะ</p>
                    <div class="space-y-2">
                        <a href="#" class="block p-2.5 bg-white rounded-full text-center font-medium text-[#5c4a3e] border border-[#e6d6cc] hover:bg-[#f7efe9] transition-colors">Line Official: @SUMMER_SHOP</a>
                        <a href="#" class="block p-2.5 bg-white rounded-full text-center font-medium text-[#5c4a3e] border border-[#e6d6cc] hover:bg-[#f7efe9] transition-colors">Facebook Page: SUMMER ไอดีเกม</a>
                    </div>
                `;
            }

            content.innerHTML = html;
            overlay.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const container = document.getElementById('modal-container');
            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 150);
        }

        function scrollToReviews() {
            document.getElementById('review-section').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
