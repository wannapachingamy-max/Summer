<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMMER 🧸⋆⁺₊⋆</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts: Prompt, Mitr & Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Mitr:wght@300;400;500;600;700&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        prompt: ['Prompt', 'sans-serif'],
                        mitr: ['Mitr', 'sans-serif'],
                        serifNum: ['Cormorant Garamond', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        * {
            font-family: 'Prompt', sans-serif !important;
        }
        
        .font-mitr, .font-mitr * {
            font-family: 'Mitr', sans-serif !important;
        }

        .font-serif-num {
            font-family: 'Cormorant Garamond', serif !important;
        }

        /* โทนสีพาสเทลละมุนตาตามเรฟอ้างอิง */
        body {
            background-color: #f6f0ec;
            background-image: 
                radial-gradient(at 10% 10%, rgba(244, 228, 220, 0.8) 0px, transparent 55%),
                radial-gradient(at 90% 90%, rgba(225, 235, 228, 0.8) 0px, transparent 60%);
            background-attachment: fixed;
            color: #4a403a;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ส่วนหัวชื่อร้าน */
        .text-header-title {
            color: #5c4a42;
            letter-spacing: 0.05em;
        }

        /* ใบไม้/ไอคอนร่วงธรรมชาติ */
        .leaf-container {
            position: fixed;
            top: -10%;
            left: 0;
            width: 100%;
            height: 120vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .leaf {
            position: absolute;
            top: -20px;
            font-size: 1.2rem;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.5; }
            100% { transform: translateY(110vh) rotate(360deg) translateX(40px); opacity: 0; }
        }

        .leaf:nth-child(1) { left: 8%; animation-duration: 10s; animation-delay: 0s; }
        .leaf:nth-child(2) { left: 25%; animation-duration: 13s; animation-delay: 2s; }
        .leaf:nth-child(3) { left: 45%; animation-duration: 9s; animation-delay: 4s; }
        .leaf:nth-child(4) { left: 70%; animation-duration: 11s; animation-delay: 1s; }
        .leaf:nth-child(5) { left: 88%; animation-duration: 12s; animation-delay: 3s; }

        .capsule-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(226, 214, 206, 0.8);
            box-shadow: 0 8px 25px -4px rgba(160, 140, 130, 0.12);
            border-radius: 9999px !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .capsule-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 12px 30px -4px rgba(160, 140, 130, 0.2);
        }

        /* การ์ดรีวิวทรงแคปซูลพาสเทล */
        .review-capsule-item {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(230, 218, 210, 0.9);
            box-shadow: 0 6px 20px rgba(160, 140, 130, 0.1);
            border-radius: 9999px !important;
            flex: 0 0 auto;
            width: 310px;
        }

        /* การ์ดสถิติ 4 ช่อง โทนละมุน */
        .stat-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(230, 218, 210, 0.9);
            border-radius: 1.25rem;
            box-shadow: 0 4px 15px rgba(160, 140, 130, 0.06);
        }

        /* แถบเมนูด้านล่างทรงแคปซูล */
        .bottom-nav-capsule {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(230, 218, 210, 0.9);
            box-shadow: 0 10px 30px rgba(160, 140, 130, 0.2);
            border-radius: 9999px !important;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(2deg); }
        }
        .animate-float {
            animation: floatSlow 4s ease-in-out infinite;
        }

        /* ระบบเลื่อนรันต่อเนื่อง (Infinite Marquee) */
        .marquee-container {
            overflow: hidden;
            width: 100%;
            position: relative;
            display: flex;
        }

        .marquee-track {
            display: flex;
            gap: 16px;
            width: max-content;
            animation: scrollMarquee 25s linear infinite;
        }

        .marquee-container:hover .marquee-track {
            animation-play-state: paused;
        }

        @keyframes scrollMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-50% - 8px)); }
        }
    </style>
</head>
<body class="min-h-screen pb-32 selection:bg-[#e2d6ce] relative">

    <!-- ใบไม้/ไอคอนร่วงเบาๆ -->
    <div class="leaf-container">
        <span class="leaf">🧸</span>
        <span class="leaf">✨</span>
        <span class="leaf">🤍</span>
        <span class="leaf">🎀</span>
        <span class="leaf">🧸</span>
    </div>

    <div class="max-w-lg mx-auto min-h-screen flex flex-col justify-between px-4 py-6 relative z-10">
        
        <div>
            <!-- Header โทนละมุน -->
            <header class="flex items-center justify-between mb-7 pt-3 pl-1 relative">
                <div class="flex items-center gap-4">
                    <div class="relative group flex-shrink-0">
                        <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-[#d4b5a0] via-[#e6d0c4] to-[#f4e4dc] p-1 shadow-md flex items-center justify-center animate-float">
                            <div class="w-full h-full rounded-full bg-[#ffffff] flex items-center justify-center overflow-hidden border-2 border-[#f0e6e0]">
                                <span class="text-3xl">🧸</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="text-left">
                        <h1 class="text-3xl font-extrabold tracking-wide text-header-title flex items-center gap-2 font-mitr leading-none">
                            SUMMER
                            <span class="text-sm text-[#b08968] font-normal">. ♡ ˚</span>
                        </h1>
                        <p class="text-xs text-[#8c7a70] tracking-tight mt-1.5 font-medium">˚｡⋆ welcome to store 🦝 ⋆｡˚</p>
                    </div>
                </div>

                <!-- สถานะร้านค้า -->
                <div class="px-3.5 py-1.5 rounded-full bg-white/90 border-2 border-[#e6d0c4] backdrop-blur-md shadow-sm flex items-center gap-2">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-600"></span>
                    </span>
                    <span class="text-[11px] font-bold text-[#6b5b52] font-mitr">ร้านเปิดบริการ</span>
                </div>
            </header>

            <!-- คำโปรย -->
            <div class="capsule-card px-6 py-4 mb-5 text-xs text-[#6b5b52] leading-relaxed relative overflow-hidden flex items-center gap-3">
                <span class="text-lg flex-shrink-0 animate-bounce">🎀</span>
                <p class="text-xs leading-snug font-medium">
                    รับซื้อขายไอดีราคาร้อน ขายไอดีเกมช่องทางการติดต่อกดช่องคอนแทคได้เลย ฝากรีวิวด้วยน้าคะเป็นกำลังใจ 🪞🪄
                </p>
            </div>

            <!-- รายการเมนูหลัก -->
            <main class="space-y-4">
                
                <!-- ช่องใส่รูป GIF 1 -->
                <div class="w-full rounded-3xl overflow-hidden shadow-md border-2 border-[#e6d0c4] bg-white/60 backdrop-blur-md p-1.5 mb-2">
                    <img src="2D5182E6-2D73-460D-AA9B-4E6A3B7158C4.gif" alt="GIF ตกแต่งพิเศษ" class="w-full h-auto max-h-48 object-cover rounded-2xl block">
                </div>

                <!-- ปุ่ม 1 -->
                <button onclick="openModal('rov')" class="w-full capsule-card px-5 py-4 flex items-center justify-between group">
                    <div class="flex items-center space-x-4">
                        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-[#f4e4dc] to-[#e6d0c4] flex items-center justify-center text-[#7c5e50] flex-shrink-0 shadow-sm">
                            <i data-lucide="gamepad-2" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-bold text-[#5c4a42] font-mitr">౨ৎ งานป้าย Rov</span>
                            <span class="text-[11px] text-[#8c7a70]">ดูเรทงานและตัวอย่างป้ายทั้งหมด</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-[#8c7a70]"></i>
                </button>

                <!-- ปุ่ม 2 -->
                <button onclick="openModal('queue')" class="w-full capsule-card px-5 py-4 flex items-center justify-between group">
                    <div class="flex items-center space-x-4">
                        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-[#f4e4dc] to-[#faedcd] flex items-center justify-center text-[#7c5e50] flex-shrink-0 shadow-sm">
                            <i data-lucide="calendar" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-bold text-[#5c4a42] font-mitr">⟢ เช็คคิว</span>
                            <span class="text-[11px] text-[#8c7a70]">ตารางคิวสถานะปัจจุบัน</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-[#8c7a70]"></i>
                </button>

                <!-- ปุ่ม 3 -->
                <button onclick="openModal('stock')" class="w-full capsule-card px-5 py-4 flex items-center justify-between group">
                    <div class="flex items-center space-x-4">
                        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-[#faedcd] to-[#fefae0] flex items-center justify-center text-[#9a7b54] flex-shrink-0 shadow-sm">
                            <i data-lucide="sparkles" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-bold text-[#5c4a42] font-mitr">🪽 ไอดีที่ยังเหลืออยู่</span>
                            <span class="text-[11px] text-[#8c7a70]">รายการไอดีพร้อมส่งมอบ</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-[#8c7a70]"></i>
                </button>

                <!-- ช่องใส่รูป GIF 2 รูป -->
                <div class="grid grid-cols-2 gap-3 my-2">
                    <div class="w-full aspect-square rounded-3xl overflow-hidden shadow-md border-2 border-[#e6d0c4] bg-white/60 backdrop-blur-md p-1">
                        <img src="F1090F6F-DB2D-4F4A-A801-E791E5E752EF.gif" alt="GIF ตกแต่ง 1" class="w-full h-full object-cover rounded-2xl block">
                    </div>
                    <div class="w-full aspect-square rounded-3xl overflow-hidden shadow-md border-2 border-[#e6d0c4] bg-white/60 backdrop-blur-md p-1">
                        <img src="EE699540-D77C-4585-B36E-402392D54160.gif" alt="GIF ตกแต่ง 2" class="w-full h-full object-cover rounded-2xl block">
                    </div>
                </div>

                <!-- ส่วนรีวิว : "รีวิวจากคุณลูกค้า" แบบรันต่อเนื่องวนลูป (Continuous Marquee) -->
                <section id="review-section" class="pt-4 pb-2">
                    
                    <div class="flex items-center justify-between mb-3 px-1">
                        <div class="flex items-center gap-2">
                            <span class="w-7 h-7 rounded-full bg-[#d4b5a0] text-white flex items-center justify-center shadow-sm">
                                <i data-lucide="message-circle-heart" class="w-3.5 h-3.5"></i>
                            </span>
                            <h2 class="text-sm font-bold text-[#6b5b52] font-mitr tracking-wide">รีวิวจากคุณลูกค้า</h2>
                        </div>
                        <span class="text-[10px] text-[#9c8578] font-medium flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                            Continuous Feed
                        </span>
                    </div>

                    <!-- การ์ดสถิติ 4 ช่อง -->
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div class="stat-card py-4 px-3 flex flex-col items-center justify-center text-center">
                            <span class="text-2xl font-serif-num text-[#5c4a42] mb-0.5 font-bold">4</span>
                            <span class="text-[11px] text-[#8c7a70] font-prompt font-semibold">รีวิวทั้งหมด</span>
                        </div>
                        <div class="stat-card py-4 px-3 flex flex-col items-center justify-center text-center">
                            <span class="text-2xl font-serif-num text-[#5c4a42] mb-0.5 font-bold">5.0</span>
                            <span class="text-[11px] text-[#8c7a70] font-prompt font-semibold">คะแนนเฉลี่ย</span>
                        </div>
                        <div class="stat-card py-4 px-3 flex flex-col items-center justify-center text-center">
                            <span class="text-2xl font-serif-num text-[#5c4a42] mb-0.5 font-bold">4</span>
                            <span class="text-[11px] text-[#8c7a70] font-prompt font-semibold">รีวิว 5 ดาว</span>
                        </div>
                        <div class="stat-card py-4 px-3 flex flex-col items-center justify-center text-center">
                            <span class="text-2xl font-serif-num text-[#5c4a42] mb-0.5 font-bold">0</span>
                            <span class="text-[11px] text-[#8c7a70] font-prompt font-semibold">รีวิว 1 ดาว</span>
                        </div>
                    </div>

                    <!-- พื้นที่รันแถวรีวิวต่อเนื่อง -->
                    <div class="marquee-container py-2">
                        <div class="marquee-track" id="marquee-track-content">
                            <!-- ถูกเติมอัตโนมัติด้วย JavaScript และทำซ้ำเพื่อลูปเนียนตา -->
                        </div>
                    </div>

                </section>
            </main>
        </div>

        <!-- แถบเมนูด้านล่าง ทรงแคปซูล -->
        <footer class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2.5rem)] max-w-sm z-40">
            <nav class="bottom-nav-capsule px-6 py-2.5 flex items-end justify-between relative">
                
                <button onclick="scrollToReviews()" class="flex flex-col items-center group pb-0.5">
                    <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-[#6b5b52] group-hover:bg-[#f4e4dc] shadow-sm border border-[#e6d0c4] transition-all">
                        <i data-lucide="message-square" class="w-4 h-4"></i>
                    </div>
                </button>

                <!-- ปุ่ม Home -->
                <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center -mt-5 group">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-[#d4b5a0] via-[#e6d0c4] to-[#f4e4dc] text-white flex items-center justify-center shadow-md border-2 border-white group-hover:scale-105 transition-all">
                        <i data-lucide="home" class="w-5 h-5 text-[#5c4a42]"></i>
                    </div>
                    <span class="text-[10px] font-extrabold text-[#5c4a42] mt-1 font-mitr tracking-wide">Home</span>
                </button>

                <button onclick="openModal('contact')" class="flex flex-col items-center group pb-0.5">
                    <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-[#6b5b52] group-hover:bg-[#f4e4dc] shadow-sm border border-[#e6d0c4] transition-all">
                        <i data-lucide="contact" class="w-4 h-4"></i>
                    </div>
                </button>

            </nav>
        </footer>

    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#fcf8f5] border-2 border-[#e6d0c4] rounded-3xl max-w-sm w-full p-5 relative shadow-xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-[#e6d0c4] flex items-center justify-center text-[#5c4a42]">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <div id="modal-content" class="text-xs space-y-3"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const sampleReviews = [
            { name: "คุณน้องแป้ง RoV", rating: 5, text: "ซื้อไอดีกับร้าน SUMMER โอนปุ๊บรหัสเข้าปั๊บ ไวมากแม่ แนะนำเลยค่า ✨✨", time: "5 นาทีที่แล้ว", bg: "bg-[#d4b5a0]" },
            { name: "น้องกอล์ฟ สายลุย", rating: 5, text: "ขายไอดีราคาร้อนกับร้านนี้ ให้ราคาดีมาก แม่ค้าพูดจาดี น่ารักครับ ❤️", time: "18 นาทีที่แล้ว", bg: "bg-[#c29b88]" },
            { name: "ลูกค้าประจำ #88", rating: 5, text: "เครดิตแน่น ซื้อขายสบายใจได้แน่นอนครับ ป้าย RoV ของจริง!", time: "1 ชั่วโมงที่แล้ว", bg: "bg-[#a38675]" },
            { name: "น้องพลอย_RoV", rating: 5, text: "สั่งทำป้าย RoV สวยสะดุดตามากกก มีรอบหน้าอีกแน่นอนค่ะ ✨", time: "2 ชั่วโมงที่แล้ว", bg: "bg-[#b08968]" }
        ];

        function renderMarqueeReviews() {
            const track = document.getElementById('marquee-track-content');
            track.innerHTML = '';

            // ทำซ้ำ 2 ชุดเพื่อให้การรันวนลูปต่อกันแบบไร้รอยต่อ (Infinite Loop)
            const listToRender = [...sampleReviews, ...sampleReviews, ...sampleReviews];

            listToRender.forEach((rev) => {
                const initial = rev.name.charAt(0);
                const starsHtml = '★'.repeat(rev.rating);
                
                const card = document.createElement('div');
                card.className = "review-capsule-item px-4 py-3.5";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded-full ${rev.bg} text-white font-bold flex items-center justify-center text-[10px] shadow-sm flex-shrink-0">
                                ${initial}
                            </div>
                            <span class="font-bold text-xs text-[#5c4a42] font-mitr truncate max-w-[130px]">${rev.name}</span>
                        </div>
                        <span class="text-[9px] text-[#9c8578] font-medium">${rev.time}</span>
                    </div>
                    <div class="flex items-start justify-between pl-8 gap-1">
                        <p class="text-[#4a403a] text-xs leading-snug font-normal line-clamp-1">${rev.text}</p>
                        <span class="text-amber-500 text-[10px] tracking-wider flex-shrink-0">${starsHtml}</span>
                    </div>
                `;
                track.appendChild(card);
            });
        }

        renderMarqueeReviews();

        function openModal(type) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            let html = '';
            if (type === 'rov') {
                html = `
                    <h3 class="font-bold text-sm text-[#5c4a42] mb-2 font-mitr">౨ৎ งานป้าย RoV</h3>
                    <p class="text-[#7c5e50] mb-2">รับทำป้ายโปรไฟล์ RoV, ป้ายเครดิต, ป้ายตกแต่งสตรีมมิ่ง สไตล์สวยหวานน่ารัก</p>
                    <div class="bg-white p-3 rounded-2xl border border-[#e6d0c4] space-y-1">
                        <div class="flex justify-between"><span>ป้ายเดี่ยว:</span> <span class="font-bold text-[#7c5e50]">50 - 150 ฿</span></div>
                        <div class="flex justify-between"><span>ป้ายคู่ / ทีม:</span> <span class="font-bold text-[#7c5e50]">180 - 350 ฿</span></div>
                    </div>
                `;
            } else if (type === 'queue') {
                html = `
                    <h3 class="font-bold text-sm text-[#5c4a42] mb-2 font-mitr">⟢ สถานะเช็คคิว</h3>
                    <div class="space-y-2">
                        <div class="p-2.5 bg-white rounded-full flex justify-between items-center border border-[#e6d0c4] px-4">
                            <span>คิวที่ 1: คุณ Mild</span>
                            <span class="text-[10px] bg-[#d4b5a0] text-white px-2.5 py-0.5 rounded-full font-bold">กำลังทำ</span>
                        </div>
                    </div>
                `;
            } else if (type === 'stock') {
                html = `
