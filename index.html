<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMMER 🧸⋆⁺₊⋆</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Kanit & Itim -->
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', 'Itim', cursive, sans-serif;
            background: linear-gradient(180deg, #fbf7f4 0%, #f5ece5 50%, #efe4db 100%);
            color: #6b584c;
        }
        .font-cute {
            font-family: 'Itim', cursive;
        }
        .soft-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(230, 215, 205, 0.8);
            box-shadow: 0 8px 20px -6px rgba(168, 142, 128, 0.12);
        }
        .sage-btn {
            background-color: #cbd5c0;
            color: #4a5442;
            transition: all 0.2s ease;
        }
        .sage-btn:hover {
            background-color: #bfcca2;
            transform: translateY(-2px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1e9e3;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d4c3b7;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen pb-24 selection:bg-[#e6d7cd]">

    <!-- Container สำหรับแสดงผลหน้าจอแบบ Mobile/Desktop -->
    <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between px-4 py-6 relative">
        
        <!-- Header & Main Content -->
        <div>
            <!-- ส่วนหัว (Header) : โลโก้ + ชื่อร้าน ชิดฝั่งซ้าย -->
            <header class="flex items-center space-x-3 mb-4 pt-2">
                <!-- โลโก้ทรงกลมสไตล์ Y2K Soft Brown -->
                <div class="relative group">
                    <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-[#dfcecf] to-[#e8d2c4] p-0.5 shadow-sm flex items-center justify-center">
                        <div class="w-full h-full rounded-full bg-[#fbf7f4] flex items-center justify-center overflow-hidden border border-[#eddcd0]">
                            <span class="text-2xl">🧸</span>
                        </div>
                    </div>
                    <span class="absolute -bottom-1 -right-1 text-xs">✨</span>
                </div>
                
                <!-- ชื่อร้าน -->
                <div>
                    <h1 class="text-2xl font-semibold tracking-wider text-[#5c4a3e] flex items-center gap-1 font-cute">
                        SUMMER
                        <span class="text-xs text-[#a38f83]">. ♡ ˚</span>
                    </h1>
                    <p class="text-[11px] text-[#9c8678] tracking-tight">˚｡⋆ welcome to store 🦝 ⋆｡˚</p>
                </div>
            </header>

            <!-- คำโปรยอธิบาย -->
            <div class="soft-card rounded-2xl p-3.5 mb-6 text-xs text-[#786455] leading-relaxed relative overflow-hidden">
                <div class="absolute top-1 right-2 text-xs opacity-40">🎀</div>
                <p class="flex items-start gap-1.5">
                    <span>⟢</span>
                    <span>รับซื้อขายไอดีราคาร้อน ขายไอดีเกมช่องทางการติดต่อกด ช่องคอนแทคได้เลย ฝากรีวิวด้วยน้าคะเป็นกำลังใจ 🪞🪄</span>
                </p>
            </div>

            <!-- บอดี้ (Body Menu Cards) -->
            <main class="space-y-3.5">
                
                <!-- 1. งานป้าย Rov -->
                <button onclick="openModal('rov')" class="w-full soft-card hover:bg-white/90 p-4 rounded-2xl flex items-center justify-between group transition-all duration-200 border border-[#ebdcd0]">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-[#f0e4db] flex items-center justify-center text-[#735e50] group-hover:scale-105 transition-transform">
                            <i data-lucide="gamepad-2" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-medium text-[#5c4a3e] font-cute">౨ৎ งานป้าย Rov</span>
                            <span class="text-[11px] text-[#9c8678]">ดูเรทงานและตัวอย่างป้ายทั้งหมด</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-[#b39e91] group-hover:translate-x-1 transition-transform"></i>
                </button>

                <!-- 2. เช็คคิว -->
                <button onclick="openModal('queue')" class="w-full soft-card hover:bg-white/90 p-4 rounded-2xl flex items-center justify-between group transition-all duration-200 border border-[#ebdcd0]">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-[#e3eae0] flex items-center justify-center text-[#586851] group-hover:scale-105 transition-transform">
                            <i data-lucide="calendar" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-medium text-[#5c4a3e] font-cute">⟢ เช็คคิว</span>
                            <span class="text-[11px] text-[#9c8678]">ตารางคิวสถานะปัจจุบัน</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-[#b39e91] group-hover:translate-x-1 transition-transform"></i>
                </button>

                <!-- 3. ไอดีที่ยังเหลืออยู่ -->
                <button onclick="openModal('stock')" class="w-full soft-card hover:bg-white/90 p-4 rounded-2xl flex items-center justify-between group transition-all duration-200 border border-[#ebdcd0]">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-[#f5e6e8] flex items-center justify-center text-[#805e63] group-hover:scale-105 transition-transform">
                            <i data-lucide="sparkles" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-medium text-[#5c4a3e] font-cute">🪽 ไอดีที่ยังเหลืออยู่</span>
                            <span class="text-[11px] text-[#9c8678]">รายการไอดีพร้อมส่งมอบ</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-[#b39e91] group-hover:translate-x-1 transition-transform"></i>
                </button>

                <!-- ส่วนอัพเดทเรียลไทม์ (Live Review Feed) -->
                <section class="pt-2">
                    <div class="flex items-center justify-between px-1 mb-2">
                        <h2 class="text-xs font-semibold text-[#6e5a4d] flex items-center gap-1 font-cute">
                            <span>♡</span> Review Feed 
                            <span class="relative flex h-2 w-2 ml-1">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#829e75] opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-[#708b63]"></span>
                            </span>
                        </h2>
                        <span class="text-[10px] text-[#a18c7f]">Real-time Updates</span>
                    </div>

                    <!-- กล่องข้อความรีวิวเรียลไทม์ -->
                    <div class="soft-card rounded-2xl p-3 h-48 flex flex-col border border-[#ebdcd0]">
                        <div id="review-list" class="space-y-2 overflow-y-auto custom-scrollbar pr-1 flex-1">
                            <!-- ข้อความรีวิวจะถูกโหลดขึ้นที่นี่แบบ Real-time -->
                        </div>
                        
                        <!-- ฟอร์มพิมพ์รีวิวทดสอบ -->
                        <div class="mt-2.5 pt-2 border-t border-[#eee1d8] flex gap-1.5">
                            <input id="user-review-input" type="text" placeholder="เขียนรีวิวให้ร้านค้า... 💬" class="flex-1 bg-white/80 text-xs px-3 py-1.5 rounded-full border border-[#e3d3c8] focus:outline-none focus:border-[#a89080] text-[#6b584c] placeholder-[#beada2]">
                            <button onclick="addReview()" class="sage-btn px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1">
                                <span>ส่ง</span>
                                <i data-lucide="send" class="w-3 h-3"></i>
                            </button>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <!-- ส่วนท้าย (Footer Navbar) -->
        <footer class="fixed bottom-3 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md z-40">
            <nav class="soft-card rounded-full p-1.5 flex items-center justify-around border border-[#e6d6cc] shadow-lg">
                <!-- Review Button -->
                <button onclick="scrollToReviews()" class="flex-1 py-1.5 flex flex-col items-center text-[#7a6759] hover:text-[#4a3c32] transition-colors">
                    <i data-lucide="message-square-heart" class="w-4 h-4 mb-0.5"></i>
                    <span class="text-[10px] font-medium font-cute">Review</span>
                </button>

                <!-- Home Button (Active) -->
                <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex-1 py-1.5 flex flex-col items-center text-[#4a5442] bg-[#cbd5c0] rounded-full shadow-sm transition-all">
                    <i data-lucide="home" class="w-4 h-4 mb-0.5"></i>
                    <span class="text-[10px] font-medium font-cute">HOME</span>
                </button>

                <!-- Contact Button -->
                <button onclick="openModal('contact')" class="flex-1 py-1.5 flex flex-col items-center text-[#7a6759] hover:text-[#4a3c32] transition-colors">
                    <i data-lucide="contact-2" class="w-4 h-4 mb-0.5"></i>
                    <span class="text-[10px] font-medium font-cute">Contact</span>
                </button>
            </nav>
        </footer>

    </div>

    <!-- Modals (หน้าต่างป๊อปอัพเมนูต่างๆ) -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#fbf7f4] border border-[#ebdcd0] rounded-3xl max-w-sm w-full p-5 relative shadow-xl transform transition-all">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-[#eee1d8] flex items-center justify-center text-[#6e5a4d]">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            
            <div id="modal-content" class="text-xs space-y-3">
                <!-- โหลดเนื้อหา Modal ตามหัวข้อที่กด -->
            </div>
        </div>
    </div>

    <script>
        // เริ่มต้นใช้งาน Lucide Icons
        lucide.createIcons();

        // ข้อมูลรีวิวตั้งต้น
        const sampleReviews = [
            { name: "Minnie ♡", text: "บริการดีมากค่ะ ได้ไอดีไวมาก ตอบแชทไวสุดๆ 🧸✨", time: "เมื่อกี้" },
            { name: "Pond_RoV", text: "งานป้ายสวยถูกใจ คิวไวกว่าที่คิดเยอะเลยครับ 🔥", time: "2 นาทีที่แล้ว" },
            { name: "K.Fern", text: "ซื้อขายปลอดภัย แม่ค้าใจดีมีของแถมด้วย นำเสนอเลยน้า 💕", time: "5 นาทีที่แล้ว" }
        ];

        // ฟังก์ชันโหลดรีวิว
        function renderReviews() {
            const list = document.getElementById('review-list');
            list.innerHTML = '';
            sampleReviews.forEach(rev => {
                const item = document.createElement('div');
                item.className = "p-2.5 rounded-xl bg-white/60 border border-[#f0e3d9] text-xs transition-all animate-fade-in";
                item.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-medium text-[#5c4a3e] font-cute flex items-center gap-1">
                            <span class="text-[10px]">🕊️</span> ${rev.name}
                        </span>
                        <span class="text-[9px] text-[#b39e91]">${rev.time}</span>
                    </div>
                    <p class="text-[#786455] text-[11px] leading-relaxed">${rev.text}</p>
                `;
                list.appendChild(item);
            });
        }

        // เพิ่มรีวิวใหม่
        function addReview() {
            const input = document.getElementById('user-review-input');
            const val = input.value.trim();
            if (val) {
                sampleReviews.unshift({
                    name: "คุณลูกค้า ♡",
                    text: val,
                    time: "เมื่อกี้"
                });
                input.value = '';
                renderReviews();
            }
        }

        // ระบบจำลอง Live Feed เด้งรีวิวอัตโนมัติ
        const randomTexts = [
            "โอนไว โอนจริง ดันๆให้ร้าน SUMMER ครับ ⭐",
            "ได้ไอดีเรียบร้อยครับ ปลอดภัย 100% เลิฟเลย 💗",
            "สั่งทำป้าย RoV สวยสะดุดตามากกก มีรอบหน้าอีกแน่นอนค่ะ ✨"
        ];
        const randomNames = ["Ice_cube 🍦", "Ploy_K 🌸", "Bank_Rov 🎮", "Catty 🐾"];

        setInterval(() => {
            const randName = randomNames[Math.floor(Math.random() * randomNames.length)];
            const randText = randomTexts[Math.floor(Math.random() * randomTexts.length)];
            sampleReviews.unshift({
                name: randName,
                text: randText,
                time: "เมื่อกี้"
            });
            if (sampleReviews.length > 8) sampleReviews.pop();
            renderReviews();
        }, 8000);

        renderReviews();

        // ฟังก์ชัน Modal
        function openModal(type) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            let html = '';
            if (type === 'rov') {
                html = `
                    <h3 class="font-semibold text-sm text-[#5c4a3e] mb-2 font-cute flex items-center gap-1">౨ৎ งานป้าย RoV</h3>
                    <p class="text-[#786455] mb-2">รับทำป้ายโปรไฟล์ RoV, ป้ายเครดิต, ป้ายตกแต่งสตรีมมิ่ง สไตล์สวยหวานน่ารัก</p>
                    <div class="bg-white/80 p-3 rounded-xl border border-[#ede0d4] space-y-1">
                        <div class="flex justify-between"><span>ป้ายเดี่ยว:</span> <span class="font-medium text-[#4a5442]">50 - 150 ฿</span></div>
                        <div class="flex justify-between"><span>ป้ายคู่ / ทีม:</span> <span class="font-medium text-[#4a5442]">180 - 350 ฿</span></div>
                    </div>
                `;
            } else if (type === 'queue') {
                html = `
                    <h3 class="font-semibold text-sm text-[#5c4a3e] mb-2 font-cute flex items-center gap-1">⟢ สถานะเช็คคิว</h3>
                    <div class="space-y-2">
                        <div class="p-2 bg-white/80 rounded-xl flex justify-between items-center border border-[#e3eae0]">
                            <span>คิวที่ 1: คุณ Mild</span>
                            <span class="text-[10px] bg-[#cbd5c0] text-[#4a5442] px-2 py-0.5 rounded-full">กำลังทำ</span>
                        </div>
                        <div class="p-2 bg-white/80 rounded-xl flex justify-between items-center border border-[#eee1d8]">
                            <span>คิวที่ 2: คุณ Oat</span>
                            <span class="text-[10px] bg-[#e8ded5] text-[#7a6759] px-2 py-0.5 rounded-full">รอคิว</span>
                        </div>
                    </div>
                `;
            } else if (type === 'stock') {
                html = `
                    <h3 class="font-semibold text-sm text-[#5c4a3e] mb-2 font-cute flex items-center gap-1">🪽 ไอดีที่ยังเหลืออยู่</h3>
                    <div class="space-y-2">
                        <div class="p-2.5 bg-white/80 rounded-xl border border-[#ebdcd0]">
                            <div class="font-medium text-[#5c4a3e]">ID RoV - สกินสเปเชียลครบ</div>
                            <div class="text-[10px] text-[#9c8678]">รูน 90 | ฮีโร่ครบ | สกิน 180+</div>
                            <div class="text-xs font-semibold text-[#6e8563] mt-1">ราคา 1,290 ฿ (พร้อมโอนลดได้)</div>
                        </div>
                    </div>
                `;
            } else if (type === 'contact') {
                html = `
                    <h3 class="font-semibold text-sm text-[#5c4a3e] mb-2 font-cute flex items-center gap-1">📮 ช่องทางการติดต่อ</h3>
                    <p class="text-[#786455] mb-3">กดเลือกช่องทางเพื่อสอบถามหรือสั่งซื้อได้เลยค่ะ</p>
                    <div class="space-y-2">
                        <a href="#" class="block p-2.5 bg-white rounded-xl text-center font-medium text-[#5c4a3e] border border-[#e6d6cc] hover:bg-[#f7efe9]">Line Official: @SUMMER_SHOP</a>
                        <a href="#" class="block p-2.5 bg-white rounded-xl text-center font-medium text-[#5c4a3e] border border-[#e6d6cc] hover:bg-[#f7efe9]">Facebook Page: SUMMER ไอดีเกม</a>
                    </div>
                `;
            }

            content.innerHTML = html;
            overlay.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        function scrollToReviews() {
            document.getElementById('review-list').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
