<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMMER </title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Mitr:wght@300;400;500;600;700&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        prompt: ['Prompt', 'sans-serif'],
                        mitr: ['Mitr', 'sans-serif'],
                        serifNum: ['Cormorant Garamond', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        * { font-family: 'Prompt', sans-serif !important; }
        .font-mitr, .font-mitr * { font-family: 'Mitr', sans-serif !important; }
        .font-serif-num { font-family: 'Cormorant Garamond', serif !important; }

        body {
            background-color: #e8eaec;
            background-image: 
                radial-gradient(rgba(210, 215, 220, 0.5) 1.5px, transparent 1.5px),
                radial-gradient(at 20% 20%, rgba(245, 247, 249, 0.95) 0px, transparent 60%),
                radial-gradient(at 80% 80%, rgba(215, 220, 225, 0.9) 0px, transparent 60%);
            background-size: 26px 26px, 100% 100%, 100% 100%;
            background-attachment: fixed;
            color: #2b2d31;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .text-header-title { color: #2b2d31; letter-spacing: 0.05em; }

        /* ก้อนเมฆหมอกสีเทาจางๆ ลอยไปมา */
        .cloud-bg-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; pointer-events: none; z-index: 0; overflow: hidden;
        }
        .big-cloud {
            position: absolute;
            background: rgba(240, 243, 246, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 100px;
            box-shadow: 0 12px 35px rgba(150, 160, 170, 0.1);
            animation: moveCloud linear infinite;
        }
        .big-cloud::before, .big-cloud::after {
            content: '';
            position: absolute;
            background: rgba(240, 243, 246, 0.85);
            border-radius: 50%;
        }
        .cloud-1 {
            width: 160px; height: 55px; top: 12%; left: -180px; animation-duration: 35s;
        }
        .cloud-1::before { width: 70px; height: 70px; top: -35px; left: 25px; }
        .cloud-1::after { width: 50px; height: 50px; top: -22px; left: 80px; }

        .cloud-2 {
            width: 200px; height: 65px; top: 58%; left: -220px; animation-duration: 45s; animation-delay: 15s;
        }
        .cloud-2::before { width: 90px; height: 90px; top: -45px; left: 35px; }
        .cloud-2::after { width: 65px; height: 65px; top: -30px; left: 105px; }

        .cloud-3 {
            width: 140px; height: 48px; top: 82%; left: -160px; animation-duration: 30s; animation-delay: 8s;
        }
        .cloud-3::before { width: 60px; height: 60px; top: -28px; left: 20px; }
        .cloud-3::after { width: 45px; height: 45px; top: -20px; left: 70px; }

        @keyframes moveCloud {
            0% { transform: translateX(0); opacity: 0; }
            10% { opacity: 0.9; }
            90% { opacity: 0.9; }
            100% { transform: translateX(calc(100vw + 250px)); opacity: 0; }
        }

        .leaf-container {
            position: fixed; top: -10%; left: 0; width: 100%; height: 120vh; pointer-events: none; z-index: 0; overflow: hidden;
        }
        .leaf {
            position: absolute; top: -20px; font-size: 1.2rem; opacity: 0.4; animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.3; }
            100% { transform: translateY(110vh) rotate(360deg) translateX(30px); opacity: 0; }
        }
        .leaf:nth-child(1) { left: 8%; animation-duration: 10s; animation-delay: 0s; }
        .leaf:nth-child(2) { left: 25%; animation-duration: 13s; animation-delay: 2s; }
        .leaf:nth-child(3) { left: 45%; animation-duration: 9s; animation-delay: 4s; }
        .leaf:nth-child(4) { left: 70%; animation-duration: 11s; animation-delay: 1s; }
        .leaf:nth-child(5) { left: 88%; animation-duration: 12s; animation-delay: 3s; }

        .capsule-card {
            background: rgba(246, 248, 250, 0.92);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(210, 215, 222, 0.9);
            box-shadow: 0 8px 25px -4px rgba(150, 160, 170, 0.08);
            border-radius: 9999px !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .capsule-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 12px 30px -4px rgba(140, 150, 160, 0.15);
            border-color: rgba(180, 190, 200, 0.9);
        }

        .review-capsule-item {
            background: rgba(246, 248, 250, 0.96);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(210, 215, 222, 0.9);
            box-shadow: 0 6px 20px rgba(150, 160, 170, 0.06);
            border-radius: 9999px !important;
            width: 100%;
        }

        .stat-card {
            background: rgba(246, 248, 250, 0.92);
            border: 1.5px solid rgba(210, 215, 222, 0.9);
            border-radius: 1.25rem;
            box-shadow: 0 4px 15px rgba(150, 160, 170, 0.05);
        }

        .bottom-nav-capsule {
            background: rgba(246, 248, 250, 0.96);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(210, 215, 222, 0.9);
            box-shadow: 0 10px 30px rgba(150, 160, 170, 0.12);
            border-radius: 9999px !important;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(2deg); }
        }
        .animate-float { animation: floatSlow 4s ease-in-out infinite; }

        .vertical-marquee-container {
            height: 140px; overflow: hidden; position: relative; width: 100%;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }
        .vertical-marquee-track {
            position: absolute; width: 100%; display: flex; flex-direction: column; gap: 12px;
            animation: scrollVertical 16s linear infinite;
        }
        .vertical-marquee-container:hover .vertical-marquee-track { animation-play-state: paused; }
        @keyframes scrollVertical {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }
    </style>
</head>
<body class="min-h-screen pb-32 selection:bg-[#d0d7de] relative">

    <!-- ก้อนเมฆหมอกลอยไปมา -->
    <div class="cloud-bg-container">
        <div class="big-cloud cloud-1"></div>
        <div class="big-cloud cloud-2"></div>
        <div class="big-cloud cloud-3"></div>
    </div>

    <div class="leaf-container">
        <span class="leaf">🧸</span><span class="leaf">✨</span><span class="leaf">🤍</span><span class="leaf">🌿</span><span class="leaf">🧸</span>
    </div>

    <div class="max-w-lg mx-auto min-h-screen flex flex-col justify-between px-4 py-6 relative z-10">
        <div>
            <header class="flex items-center justify-between mb-6 pt-3 pl-1 relative">
                <div class="flex items-center gap-4">
                    <div class="relative group flex-shrink-0">
                        <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-[#d5dadf] via-[#edf0f3] to-[#ffffff] p-1 shadow-md flex items-center justify-center animate-float border border-[#c5ccd3]">
                            <div class="w-full h-full rounded-full bg-[#f8f9fa] flex items-center justify-center overflow-hidden border border-[#d8de843]">
                                <span class="text-3xl">🧸</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-left">
                        <h1 class="text-3xl font-extrabold tracking-wide text-header-title flex items-center gap-2 font-mitr leading-none">
                            SUMMER <span class="text-sm text-[#656d76] font-normal">. ♡ ˚</span>
                        </h1>
                        <p class="text-xs text-[#57606a] tracking-tight mt-1.5 font-medium">˚｡⋆ welcome to store 🦝 ⋆｡˚</p>
                    </div>
                </div>

                <div class="px-3.5 py-1.5 rounded-full bg-white/95 border-2 border-[#d0d7de] backdrop-blur-md shadow-sm flex items-center gap-2">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-600"></span>
                    </span>
                    <span class="text-[11px] font-bold text-[#2b2d31] font-mitr">ร้านเปิดบริการ</span>
                </div>
            </header>

            <div class="px-3 mb-6 flex items-start gap-2.5 text-xs text-[#484f58] leading-relaxed">
                <span class="text-sm flex-shrink-0 mt-0.5">🌿</span>
                <p class="font-medium">
                    รับซื้อขายไอดีราคาร้อน ขายไอดีเกมช่องทางการติดต่อกดช่องคอนแทคได้เลย ฝากรีวิวด้วยน้าคะเป็นกำลังใจ
                </p>
            </div>

            <main class="space-y-4">
                <!-- GIF ด้านบนช่องป้าย Rov -->
                <div class="w-full rounded-3xl overflow-hidden shadow-md border-2 border-[#d0d7de] bg-white/80 backdrop-blur-md p-1.5 mb-2">
                    <img src="0BD18DE5-FAB3-4466-B3F4-834BED634D8C.gif" alt="GIF ตกแต่งพิเศษด้านบนป้าย Rov" class="w-full h-auto max-h-48 object-cover rounded-2xl block">
                </div>

                <button onclick="openModal('rov')" class="w-full capsule-card px-5 py-4 flex items-center justify-between group">
                    <div class="flex items-center space-x-4">
                        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-[#e1e6ec] to-[#c8d0d8] flex items-center justify-center text-[#2b2d31] flex-shrink-0 shadow-sm border border-[#b8c2cc]">
                            <i data-lucide="gamepad-2" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-bold text-[#2b2d31] font-mitr"> งานป้าย Rov</span>
                            <span class="text-[11px] text-[#57606a]">ดูเรทงานและตัวอย่างป้ายทั้งหมด</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-[#57606a]"></i>
                </button>

                <!-- ปุ่มเช็คคิว -->
                <a href="https://wannapachingamy-max.github.io/Qaummer/" target="_blank" class="w-full capsule-card px-5 py-4 flex items-center justify-between group">
                    <div class="flex items-center space-x-4">
                        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-[#e1e6ec] to-[#c8d0d8] flex items-center justify-center text-[#2b2d31] flex-shrink-0 shadow-sm border border-[#b8c2cc]">
                            <i data-lucide="calendar" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-bold text-[#2b2d31] font-mitr"> เช็คคิว</span>
                            <span class="text-[11px] text-[#57606a]">ตารางคิวสถานะปัจจุบัน</span>
                        </div>
                    </div>
                    <i data-lucide="external-link" class="w-5 h-5 text-[#57606a]"></i>
                </a>

                <button onclick="openModal('stock')" class="w-full capsule-card px-5 py-4 flex items-center justify-between group">
                    <div class="flex items-center space-x-4">
                        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-[#e1e6ec] to-[#c8d0d8] flex items-center justify-center text-[#2b2d31] flex-shrink-0 shadow-sm border border-[#b8c2cc]">
                            <i data-lucide="sparkles" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-bold text-[#2b2d31] font-mitr">ไอดีที่ยังเหลืออยู่</span>
                            <span class="text-[11px] text-[#57606a]">รายการไอดีพร้อมส่งมอบ</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-[#57606a]"></i>
                </button>

                <!-- ช่องถัดจากไอดีคงเหลือ: ปรับแต่งให้เห็นหน้าคนชัดเจนขึ้นด้วย object-position: 80% center -->
                <div class="grid grid-cols-2 gap-3 my-2">
                    <div class="w-full aspect-square rounded-3xl overflow-hidden shadow-md border-2 border-[#d0d7de] bg-white/80 backdrop-blur-md p-1">
                        <img src="BF7C4739-4770-4A78-AC3A-C0F9DED33E7B.gif" alt="GIF ตกแต่งช่องถัดจากไอดีคงเหลือ" class="w-full h-full object-cover rounded-2xl block">
                    </div>
                    <div class="w-full aspect-square rounded-3xl overflow-hidden shadow-md border-2 border-[#d0d7de] bg-white/80 backdrop-blur-md p-1">
                        <img src="att.Tzqhbn6gRRqVz4W3eKC9XNr3nY-Pg1c04bImWzd4dxw.jpeg" alt="รูปภาพตกแต่งช่องถัดจากไอดีคงเหลือ" class="w-full h-full object-cover rounded-2xl block" style="object-position: 80% center;">
                    </div>
                </div>

                <!-- ส่วนแสดงผลรีวิว -->
                <section id="review-section" class="pt-4 pb-2">
                    <div class="flex items-center justify-between mb-3 px-1">
                        <div class="flex items-center gap-2">
                            <span class="w-7 h-7 rounded-full bg-[#2b2d31] text-white flex items-center justify-center shadow-sm">
                                <i data-lucide="message-circle-heart" class="w-3.5 h-3.5"></i>
                            </span>
                            <h2 class="text-sm font-bold text-[#2b2d31] font-mitr tracking-wide">รีวิวจากคุณลูกค้า</h2>
                        </div>
                        <button onclick="openModal('review-form')" class="text-[11px] text-[#2b2d31] font-bold hover:underline font-mitr flex items-center gap-1 bg-transparent border-none cursor-pointer">
                            เขียนรีวิว <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div class="stat-card py-4 px-3 flex flex-col items-center justify-center text-center">
                            <span id="stat-total" class="text-2xl font-serif-num text-[#2b2d31] mb-0.5 font-bold">4</span>
                            <span class="text-[11px] text-[#57606a] font-prompt font-semibold">รีวิวทั้งหมด</span>
                        </div>
                        <div class="stat-card py-4 px-3 flex flex-col items-center justify-center text-center">
                            <span id="stat-avg" class="text-2xl font-serif-num text-[#2b2d31] mb-0.5 font-bold">5.0</span>
                            <span class="text-[11px] text-[#57606a] font-prompt font-semibold">คะแนนเฉลี่ย</span>
                        </div>
                        <div class="stat-card py-4 px-3 flex flex-col items-center justify-center text-center">
                            <span id="stat-fives" class="text-2xl font-serif-num text-[#2b2d31] mb-0.5 font-bold">4</span>
                            <span class="text-[11px] text-[#57606a] font-prompt font-semibold">รีวิว 5 ดาว</span>
                        </div>
                        <div class="stat-card py-4 px-3 flex flex-col items-center justify-center text-center">
                            <span id="stat-ones" class="text-2xl font-serif-num text-[#2b2d31] mb-0.5 font-bold">0</span>
                            <span class="text-[11px] text-[#57606a] font-prompt font-semibold">รีวิว 1 ดาว</span>
                        </div>
                    </div>

                    <div class="vertical-marquee-container">
                        <div class="vertical-marquee-track" id="vertical-track-content"></div>
                    </div>
                </section>
            </main>
        </div>

        <footer class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2.5rem)] max-w-sm z-40">
            <nav class="bottom-nav-capsule px-6 py-2.5 flex items-end justify-between relative">
                <button onclick="openModal('review-form')" class="flex flex-col items-center group pb-0.5 bg-transparent border-none cursor-pointer">
                    <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-[#2b2d31] group-hover:bg-[#e1e6ec] shadow-sm border border-[#d0d7de] transition-all">
                        <i data-lucide="message-square" class="w-4 h-4"></i>
                    </div>
                </button>

                <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center -mt-5 group bg-transparent border-none cursor-pointer">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-[#3a3d43] via-[#57606a] to-[#2b2d31] text-white flex items-center justify-center shadow-md border-2 border-white group-hover:scale-105 transition-all">
                        <i data-lucide="home" class="w-5 h-5 text-white"></i>
                    </div>
                    <span class="text-[10px] font-extrabold text-[#2b2d31] mt-1 font-mitr tracking-wide">Home</span>
                </button>

                <a href="https://wannapachingamy-max.github.io/Contactsummer/" target="_blank" class="flex flex-col items-center group pb-0.5">
                    <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-[#2b2d31] group-hover:bg-[#e1e6ec] shadow-sm border border-[#d0d7de] transition-all">
                        <i data-lucide="contact" class="w-4 h-4"></i>
                    </div>
                </a>
            </nav>
        </footer>
    </div>

    <!-- Modal สำหรับแสดงข้อมูลและฟอร์มเขียนรีวิว -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#f0f3f6] border-2 border-[#d0d7de] rounded-3xl max-w-sm w-full p-5 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-[#d0d7de] flex items-center justify-center text-[#2b2d31] cursor-pointer border-none">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <div id="modal-content" class="text-xs space-y-3 pt-2"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let sampleReviews = JSON.parse(localStorage.getItem('summer_store_reviews')) || [
            { name: "คุณน้องแป้ง RoV", rating: 5, text: "ซื้อไอดีกับร้าน SUMMER โอนปุ๊บรหัสเข้าปั๊บ ไวมากแม่ แนะนำเลยค่า ✨✨", time: "5 นาทีที่แล้ว", bg: "bg-[#2b2d31]" },
            { name: "น้องกอล์ฟ สายลุย", rating: 5, text: "ขายไอดีราคาร้อนกับร้านนี้ ให้ราคาดีมาก แม่ค้าพูดจาดี น่ารักครับ ❤️", time: "18 นาทีที่แล้ว", bg: "bg-[#484f58]" },
            { name: "ลูกค้าประจำ #88", rating: 5, text: "เครดิตแน่น ซื้อขายสบายใจได้แน่นอนครับ ป้าย RoV ของจริง!", time: "1 ชั่วโมงที่แล้ว", bg: "bg-[#57606a]" },
            { name: "น้องพลอย_RoV", rating: 5, text: "สั่งทำป้าย RoV สวยสะดุดตามากกก มีรอบหน้าอีกแน่นอนค่ะ ✨", time: "2 ชั่วโมงที่แล้ว", bg: "bg-[#656d76]" }
        ];

        function updateStats() {
            const total = sampleReviews.length;
            const sumRating = sampleReviews.reduce((acc, curr) => acc + curr.rating, 0);
            const avg = total > 0 ? (sumRating / total).toFixed(1) : "5.0";
            const fives = sampleReviews.filter(r => r.rating === 5).length;
            const ones = sampleReviews.filter(r => r.rating === 1).length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-avg').innerText = avg;
            document.getElementById('stat-fives').innerText = fives;
            document.getElementById('stat-ones').innerText = ones;
        }

        function renderVerticalMarquee() {
            const track = document.getElementById('vertical-track-content');
            if(!track) return;
            track.innerHTML = '';
            const listToRender = [...sampleReviews, ...sampleReviews];

            listToRender.forEach((rev) => {
                const initial = rev.name.charAt(0);
                const starsHtml = '★'.repeat(rev.rating);
                const card = document.createElement('div');
                card.className = "review-capsule-item px-5 py-3 flex-shrink-0";
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <div class="flex items-center gap-2.5">
                            <div class="w-6 h-6 rounded-full ${rev.bg} text-white font-bold flex items-center justify-center text-[10px] shadow-sm flex-shrink-0">${initial}</div>
                            <span class="font-bold text-xs text-[#2b2d31] font-mitr">${rev.name}</span>
                        </div>
                        <span class="text-[9px] text-[#57606a] font-medium">${rev.time}</span>
                    </div>
                    <div class="flex items-center justify-between pl-8 gap-2">
                        <p class="text-[#3b434b] text-xs leading-snug font-normal line-clamp-1">${rev.text}</p>
                        <span class="text-amber-500 text-[10px] tracking-wider flex-shrink-0">${starsHtml}</span>
                    </div>
                `;
                track.appendChild(card);
            });
            updateStats();
        }

        renderVerticalMarquee();

        function openModal(type) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            let html = '';
            if (type === 'rov') {
                html = `<h3 class="font-bold text-sm text-[#2b2d31] mb-2 font-mitr">౨ৎ งานป้าย RoV</h3><p class="text-[#484f58] mb-2">รับทำป้ายโปรไฟล์ RoV, ป้ายเครดิต สไตล์สวยหวานน่ารัก</p>`;
            } else if (type === 'stock') {
                html = `<h3 class="font-bold text-sm text-[#2b2d31] mb-2 font-mitr">🪽 ไอดีที่ยังเหลืออยู่</h3><div class="p-3 bg-white rounded-2xl border border-[#d0d7de]"><div class="font-bold text-[#2b2d31] font-mitr text-xs">ID RoV - สกินสเปเชียลครบ</div><div class="text-xs font-bold text-[#484f58] mt-1">ราคา 1,290 ฿</div></div>`;
            } else if (type === 'review-form') {
                html = `
                    <h3 class="font-bold text-sm text-[#2b2d31] mb-3 font-mitr">✍️ เขียนรีวิวความประทับใจ</h3>
                    <form onsubmit="submitReview(event)" class="space-y-3">
                        <div>
                            <label class="block text-[11px] font-bold text-[#2b2d31] mb-1 font-mitr">ชื่อของคุณ (หรือนามแฝง)</label>
                            <input type="text" id="rev-name" required placeholder="เช่น คุณน้องแป้ง RoV" class="w-full px-3 py-2 rounded-xl border border-[#d0d7de] bg-white text-xs text-[#2b2d31] focus:outline-none focus:border-[#2b2d31]">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-[#2b2d31] mb-1 font-mitr">ให้คะแนนความประทับใจ</label>
                            <select id="rev-rating" class="w-full px-3 py-2 rounded-xl border border-[#d0d7de] bg-white text-xs text-[#2b2d31] focus:outline-none focus:border-[#2b2d31]">
                                <option value="5">★★★★★ (5 ดาว - ดีมากยอดเยี่ยม)</option>
                                <option value="4">★★★★☆ (4 ดาว - ดี)</option>
                                <option value="3">★★★☆☆ (3 ดาว - ปานกลาง)</option>
                                <option value="2">★★☆☆☆ (2 ดาว - พอใช้)</option>
                                <option value="1">★☆☆☆☆ (1 ดาว - ต้องปรับปรุง)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-[#2b2d31] mb-1 font-mitr">ข้อความรีวิว</label>
                            <textarea id="rev-text" required rows="3" placeholder="พิมพ์ความรู้สึกหรือรีวิวบริการของเราที่นี่..." class="w-full px-3 py-2 rounded-xl border border-[#d0d7de] bg-white text-xs text-[#2b2d31] focus:outline-none focus:border-[#2b2d31] resize-none"></textarea>
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-[#2b2d31] hover:bg-[#484f58] text-white rounded-xl text-xs font-bold shadow-md transition-all font-mitr tracking-wide cursor-pointer">
                            ส่งรีวิวเข้าระบบ ✨
                        </button>
                    </form>
                `;
            }
            content.innerHTML = html;
            overlay.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() { 
            document.getElementById('modal-overlay').classList.add('hidden'); 
        }

        function submitReview(event) {
            event.preventDefault();
            const name = document.getElementById('rev-name').value.trim();
            const rating = parseInt(document.getElementById('rev-rating').value);
            const text = document.getElementById('rev-text').value.trim();

            const bgColors = ["bg-[#2b2d31]", "bg-[#484f58]", "bg-[#57606a]", "bg-[#656d76]"];
            const randomBg = bgColors[Math.floor(Math.random() * bgColors.length)];

            const newReview = {
                name: name,
                rating: rating,
                text: text,
                time: "เมื่อสักครู่",
                bg: randomBg
            };

            sampleReviews.unshift(newReview);
            localStorage.setItem('summer_store_reviews', JSON.stringify(sampleReviews));

            closeModal();
            renderVerticalMarquee();
            alert('ส่งรีวิวเรียบร้อยแล้ว ขอบคุณมากๆ ค่า! 🤍');
        }
    </script>
</body>
</html>
